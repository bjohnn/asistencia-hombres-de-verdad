<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro - Congreso Hombres de Verdad</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background-color: #f9f9f9;
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header img {
      width: 100px;
      height: auto;
    }

    h1 {
      color: #1a237e;
      margin-top: 1rem;
    }

    form {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input {
      padding: 0.8rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
    }

    button {
      background: #1a237e;
      color: white;
      padding: 1rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: #0d133b;
    }

    #mensaje {
      margin-top: 1rem;
      color: green;
      font-weight: bold;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo_congreso.png" alt="Logo Congreso" />
    <h1>Bienvenido al segundo congreso de Hombres de Verdad</h1>
  </header>

  <form id="registroForm">
    <input type="text" name="nombre" placeholder="Nombre completo" required />
    <input type="tel" name="telefono" placeholder="Teléfono" required />
    <button type="submit">Registrar</button>
  </form>

  <div id="mensaje">¡Gracias! Tu asistencia ha sido registrada.</div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbzc2PpXmxZoOV9p-iYto9B9vPG_JS0VXWovXPMveiar_IN5gMZrhXrTgtN_YIseJAzU/exec";
    const form = document.getElementById('registroForm');
    const mensaje = document.getElementById('mensaje');

    form.addEventListener('submit', e => {
      e.preventDefault();
      fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(() => {
          form.reset();
          mensaje.style.display = 'block';
        })
        .catch(error => alert('Error al registrar: ' + error.message));
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Registro de Asistencia - Congreso Hombres de Verdad</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background-color: #f9f9f9;
        margin: 0;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      header {
        text-align: center;
        margin-bottom: 2rem;
      }

      header img {
        width: 120px;
        height: auto;
      }

      h1 {
        color: #1a237e;
      }

      form {
        background: white;
        padding: 2rem;
        border-radius: 1rem;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      input[type="text"],
      input[type="tel"] {
        padding: 0.75rem;
        font-size: 1rem;
        border-radius: 0.5rem;
        border: 1px solid #ccc;
      }

      button {
        background-color: #1a237e;
        color: white;
        border: none;
        padding: 1rem;
        font-size: 1rem;
        border-radius: 0.5rem;
        cursor: pointer;
      }

      button:hover {
        background-color: #0d133b;
      }

      .mensaje {
        margin-top: 1rem;
        font-weight: bold;
        color: green;
        text-align: center;
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="logo_congreso.png" alt="Logo del Congreso" />
      <h1>Registro de Asistencia</h1>
    </header>

    <form id="registro-form">
      <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required />
      <input type="tel" id="telefono" name="telefono" placeholder="Teléfono" required />
      <button type="submit">Registrar</button>
      <div class="mensaje" id="mensaje-exito">✅ ¡Registro exitoso!</div>
    </form>

    <script>
      const form = document.getElementById("registro-form");
      const mensaje = document.getElementById("mensaje-exito");

      form.addEventListener("submit", function (e) {
        e.preventDefault();

       // <form action="https://script.google.com/macros/s/AKfycbzc2PpXmxZoOV9p-iYto9B9vPG_JS0VXWovXPMveiar_IN5gMZrhXrTgtN_YIseJAzU/exec" method="POST">

        mensaje.style.display = "block";
        form.reset();
      });
    </script>
  </body>
</html>

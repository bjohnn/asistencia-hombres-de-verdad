<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro de Asistencia - Congreso Hombres de Verdad</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background-color: #f9f9f9;
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header img {
      width: 100px;
      height: auto;
    }

    h1 {
      color: #1a237e;
      margin-top: 1rem;
    }

    .card {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }

    input {
      padding: 0.8rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
    }

    .boton-registro {
      margin-top: 1.5rem;
      background: #1a237e;
      color: white;
      padding: 1rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
    }

    .boton-registro:hover {
      background: #0d133b;
    }

    .mensaje {
      margin-top: 1.5rem;
      font-size: 1rem;
      color: green;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo_congreso.png" alt="Logo Congreso" />
    <h1>Registro de Asistencia</h1>
  </header>

  <div class="card">
    <form id="registro-form">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" required />

      <label for="telefono">Teléfono</label>
      <input type="tel" id="telefono" name="telefono" required />

      <button type="submit" class="boton-registro">Registrar</button>
    </form>

    <div class="mensaje" id="mensaje-confirmacion">¡Gracias! Tu asistencia ha sido registrada con éxito.</div>
  </div>

  <script>
    document.getElementById("registro-form").addEventListener("submit", function(e) {
      e.preventDefault();

      const form = e.target;
      const data = new FormData(form);

      fetch("TU_URL_DEL_SCRIPT", {
        method: "POST",
        body: data,
      })
      .then((res) => {
        if (res.ok) {
          document.getElementById("mensaje-confirmacion").style.display = "block";
          form.reset();
        } else {
          alert("Hubo un problema al registrar. Intenta nuevamente.");
        }
      })
      .catch((err) => {
        console.error("Error al enviar:", err);
        alert("Error de conexión.");
      });
    });
  </script>
</body>
</html>

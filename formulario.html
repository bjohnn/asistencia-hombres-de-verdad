<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Asistencia</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background-color: #f9f9f9;
        color: #222;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem;
      }

      header {
        text-align: center;
        margin-bottom: 2rem;
      }

      header img {
        width: 100px;
        height: auto;
      }

      h1 {
        color: #1a237e;
        margin-top: 1rem;
        font-size: 1.5rem;
      }

      form {
        background: white;
        padding: 2rem;
        border-radius: 1rem;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      label {
        font-weight: bold;
        margin-bottom: 0.25rem;
      }

      input[type="text"],
      input[type="email"] {
        padding: 0.75rem;
        border: 1px solid #ccc;
        border-radius: 0.5rem;
        font-size: 1rem;
      }

      button {
        background: #1a237e;
        color: white;
        padding: 1rem;
        border: none;
        border-radius: 0.5rem;
        font-size: 1rem;
        cursor: pointer;
      }

      button:hover {
        background: #0d133b;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="logo_congreso.png" alt="Logo Congreso" />
      <h1>Formulario de asistencia</h1>
    </header>

    <form action="#" method="post">
      <div>
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" required />
      </div>
      <div>
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" required />
      </div>
      <div>
        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" name="telefono" required />
      </div>
      <button type="submit">Enviar</button>
    </form>
  </body>
</html>
